services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: seethapaati-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:-seethapaati_prod}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seethapaati_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Queues: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: seethapaati-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment environment}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment environment}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend API: NestJS
  # Host access is loopback-only; expose it through the HTTPS reverse proxy.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the postgres service hostname}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment environment}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set explicit trusted storefront origins}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?Set a verified EMAIL_FROM address}
      SELLER_LEGAL_NAME: ${SELLER_LEGAL_NAME:?Set the actual registered seller legal name}
      SELLER_TRADE_NAME: ${SELLER_TRADE_NAME:?Set the actual seller trade name}
      SELLER_GSTIN: ${SELLER_GSTIN:?Set the actual valid seller GSTIN}
      SELLER_ADDRESS_LINE1: ${SELLER_ADDRESS_LINE1:?Set the registered seller address}
      SELLER_ADDRESS_LINE2: ${SELLER_ADDRESS_LINE2:-}
      SELLER_CITY: ${SELLER_CITY:?Set the registered seller city}
      SELLER_STATE: ${SELLER_STATE:?Set the registered seller state}
      SELLER_STATE_CODE: ${SELLER_STATE_CODE:?Set the GST state code matching the GSTIN}
      SELLER_PINCODE: ${SELLER_PINCODE:?Set the registered seller PIN code}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Storefront: Next.js
  # Host access is loopback-only; expose it through the HTTPS reverse proxy.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:3001/api/v1
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the browser-facing API URL including /api/v1}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-SEETHAPAATI}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical storefront URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:?Set NEXT_PUBLIC_RAZORPAY_KEY_ID}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${NEXT_PUBLIC_LEGAL_ENTITY_NAME:?Set NEXT_PUBLIC_LEGAL_ENTITY_NAME in the deployment environment}}
        NEXT_PUBLIC_BUSINESS_REGISTRATION_LABEL: ${NEXT_PUBLIC_BUSINESS_REGISTRATION_LABEL:-}
        NEXT_PUBLIC_BUSINESS_REGISTRATION_NUMBER: ${NEXT_PUBLIC_BUSINESS_REGISTRATION_NUMBER:-}
        NEXT_PUBLIC_FSSAI_LICENSE_NUMBER: ${NEXT_PUBLIC_FSSAI_LICENSE_NUMBER:?Set NEXT_PUBLIC_FSSAI_LICENSE_NUMBER in the deployment environment}}
        NEXT_PUBLIC_REGISTERED_OFFICE: ${NEXT_PUBLIC_REGISTERED_OFFICE:?Set NEXT_PUBLIC_REGISTERED_OFFICE in the deployment environment}}
        NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: ${NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME:?Set NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME in the deployment environment}}
        NEXT_PUBLIC_GRIEVANCE_EMAIL: ${NEXT_PUBLIC_GRIEVANCE_EMAIL:?Set NEXT_PUBLIC_GRIEVANCE_EMAIL in the deployment environment}}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:?Set NEXT_PUBLIC_PRIVACY_EMAIL in the deployment environment}}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:?Set NEXT_PUBLIC_LEGAL_EMAIL in the deployment environment}}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:?Set NEXT_PUBLIC_SUPPORT_EMAIL in the deployment environment}}
        NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY: ${NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY:?Set NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY in the deployment environment}}
        NEXT_PUBLIC_SUPPORT_PHONE_E164: ${NEXT_PUBLIC_SUPPORT_PHONE_E164:?Set NEXT_PUBLIC_SUPPORT_PHONE_E164 in the deployment environment}}
        NEXT_PUBLIC_WHATSAPP_PHONE: ${NEXT_PUBLIC_WHATSAPP_PHONE:?Set NEXT_PUBLIC_WHATSAPP_PHONE in the deployment environment}}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the browser-facing API URL including /api/v1}
      INTERNAL_API_URL: http://api:3001/api/v1
      UPLOAD_DIR: /app/apps/web/public/uploads
      UPLOAD_ALLOWED_ORIGINS: ${UPLOAD_ALLOWED_ORIGINS:?Set explicit trusted storefront origins}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-SEETHAPAATHI}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical storefront URL}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:?Set NEXT_PUBLIC_RAZORPAY_KEY_ID}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    volumes:
      # Persistent uploads for single-host Docker deployments. Multi-host
      # deployments require shared object storage rather than a local volume.
      - webuploads:/app/apps/web/public/uploads

volumes:
  pgdata:
  redisdata:
  webuploads:
