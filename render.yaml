services:
  # ---------------------------------------------------------------------------
  # Backend NestJS API
  # Stateless service; scale only after load testing and queue/database review.
  # ---------------------------------------------------------------------------
  - type: web
    name: seethapaati-api
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm ci && npm run build:contracts && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: seethapaati-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seethapaati-redis
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SELLER_LEGAL_NAME
        sync: false
      - key: SELLER_TRADE_NAME
        sync: false
      - key: SELLER_GSTIN
        sync: false
      - key: SELLER_ADDRESS_LINE1
        sync: false
      - key: SELLER_ADDRESS_LINE2
        sync: false
      - key: SELLER_CITY
        sync: false
      - key: SELLER_STATE
        sync: false
      - key: SELLER_STATE_CODE
        sync: false
      - key: SELLER_PINCODE
        sync: false

  # ---------------------------------------------------------------------------
  # Storefront Next.js App
  # A persistent disk keeps uploaded media across restarts. Render disks are
  # single-instance, so this service intentionally runs one instance until
  # shared object storage is integrated.
  # ---------------------------------------------------------------------------
  - type: web
    name: seethapaati-web
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm ci && npm run build:contracts && npm run build:web
    startCommand: npm run start:web
    disk:
      name: seethapaati-uploads
      mountPath: /opt/render/project/src/apps/web/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: INTERNAL_API_URL
        sync: false
      - key: NEXT_PUBLIC_STORE_NAME
        value: SEETHAPAATI
      - key: NEXT_PUBLIC_SITE_URL
        value: https://seethapaati.com
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/apps/web/public/uploads
      - key: UPLOAD_ALLOWED_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Redis Key Value for queues, caching and distributed coordination.
  # noeviction prevents Redis from silently evicting BullMQ queue keys.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: seethapaati-redis
    plan: 1g
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: seethapaati-postgres
    plan: basic-1gb
    databaseName: seethapaati
    user: postgres
    region: singapore
