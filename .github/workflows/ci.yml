name: CI
# Phase 4 final-audit verification
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seethapaati_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d seethapaati_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seethapaati_dev?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@seethapaati/contracts
      - run: npm run prisma:generate --workspace=@seethapaati/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck --workspace=@seethapaati/api
      - run: npm run lint --workspace=@seethapaati/api
      - run: npm test --workspace=@seethapaati/api -- --runInBand
      - run: npm run build --workspace=@seethapaati/api
      - run: npm run typecheck --workspace=@seethapaati/web
      - run: npm run lint --workspace=@seethapaati/web
      - name: Build web application with explicit CI-only public origins
        env:
          NEXT_PUBLIC_SITE_URL: https://store.example.test
          NEXT_PUBLIC_LEGAL_ENTITY_NAME: Acme Foods Private Limited
          NEXT_PUBLIC_BUSINESS_REGISTRATION_LABEL: 
          NEXT_PUBLIC_BUSINESS_REGISTRATION_NUMBER: 
          NEXT_PUBLIC_FSSAI_LICENSE_NUMBER: 12345678901234
          NEXT_PUBLIC_REGISTERED_OFFICE: 1 Market Road, Chennai, Tamil Nadu 600001, India
          NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: Customer Grievance Officer
          NEXT_PUBLIC_GRIEVANCE_EMAIL: grievance@acmefoods.in
          NEXT_PUBLIC_PRIVACY_EMAIL: privacy@acmefoods.in
          NEXT_PUBLIC_LEGAL_EMAIL: legal@acmefoods.in
          NEXT_PUBLIC_SUPPORT_EMAIL: care@acmefoods.in
          NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY: +91 98765 43210
          NEXT_PUBLIC_SUPPORT_PHONE_E164: +919876543210
          NEXT_PUBLIC_WHATSAPP_PHONE: 919876543210
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
        run: npm run build --workspace=@seethapaati/web
      - name: Build API production image
        run: docker build -f apps/api/Dockerfile -t seethapaati-api:ci .
      - name: Build web production image
        run: |
          docker build -f apps/web/Dockerfile -t seethapaati-web:ci \
            --build-arg INTERNAL_API_URL=http://api:3001/api/v1 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.test/api/v1 \
            --build-arg NEXT_PUBLIC_STORE_NAME=SEETHAPAATI \
            --build-arg NEXT_PUBLIC_SITE_URL=https://store.example.test \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_test_ci_public_key \
            --build-arg NEXT_PUBLIC_LEGAL_ENTITY_NAME="Acme Foods Private Limited" \
            --build-arg NEXT_PUBLIC_BUSINESS_REGISTRATION_LABEL="" \
            --build-arg NEXT_PUBLIC_BUSINESS_REGISTRATION_NUMBER="" \
            --build-arg NEXT_PUBLIC_FSSAI_LICENSE_NUMBER="12345678901234" \
            --build-arg NEXT_PUBLIC_REGISTERED_OFFICE="1 Market Road, Chennai, Tamil Nadu 600001, India" \
            --build-arg NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME="Customer Grievance Officer" \
            --build-arg NEXT_PUBLIC_GRIEVANCE_EMAIL="grievance@acmefoods.in" \
            --build-arg NEXT_PUBLIC_PRIVACY_EMAIL="privacy@acmefoods.in" \
            --build-arg NEXT_PUBLIC_LEGAL_EMAIL="legal@acmefoods.in" \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL="care@acmefoods.in" \
            --build-arg NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY="+91 98765 43210" \
            --build-arg NEXT_PUBLIC_SUPPORT_PHONE_E164="+919876543210" \
            --build-arg NEXT_PUBLIC_WHATSAPP_PHONE="919876543210"
            --build-arg NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION= .
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci_postgres_password_123456
          DATABASE_URL: postgresql://postgres:ci_postgres_password_123456@postgres:5432/seethapaati_prod?schema=public
          REDIS_PASSWORD: ci_redis_password_123456
          JWT_SECRET: ci_jwt_secret_with_more_than_32_characters_123456
          CORS_ORIGIN: https://store.example.test
          UPLOAD_ALLOWED_ORIGINS: https://store.example.test
          RAZORPAY_KEY_ID: rzp_live_ci_key_123456
          RAZORPAY_KEY_SECRET: ci_razorpay_secret_123456789
          RAZORPAY_WEBHOOK_SECRET: ci_razorpay_webhook_secret_123456789
          RESEND_API_KEY: re_ci_test_key_123456
          EMAIL_FROM: orders@example.test
          SELLER_LEGAL_NAME: Example Seller Private Limited
          SELLER_TRADE_NAME: Example Seller
          SELLER_GSTIN: 33ABCDE1234F1Z5
          SELLER_ADDRESS_LINE1: 1 Test Street
          SELLER_CITY: Coimbatore
          SELLER_STATE: Tamil Nadu
          SELLER_STATE_CODE: "33"
          SELLER_PINCODE: "641001"
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_SITE_URL: https://store.example.test
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_live_ci_public_key
        run: docker compose -f docker-compose.prod.yml config --quiet
